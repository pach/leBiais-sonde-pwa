<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1F1B16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sonde">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
    <title>Le Biais — sonde</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #FFFBF2;
            touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        /* hauteur ajustée par le script ci-dessous : le clavier d'iOS ne rétrécit pas la page */
        #ComposeTarget { position: fixed; top: 0; left: 0; right: 0; height: 100%; touch-action: none; }
    </style>
    <script src="build.js"></script>
    <script src="sonde.js"></script>
</head>
<body>
    <div id="ComposeTarget"></div>
    <script>
        // Carte : le pincement ne doit zoomer que la carte, pas la page (Safari d'iOS ignore user-scalable).
        ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) {
            document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false });
        });
        document.addEventListener("touchmove", function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
        // Clavier : la zone de la sonde suit la partie réellement visible, au-dessus du clavier.
        (function () {
            var vv = window.visualViewport, cible = document.getElementById("ComposeTarget");
            if (!vv || !cible) return;
            function ajuster() {
                cible.style.height = vv.height + "px";
                if (window.scrollY !== 0 || vv.offsetTop !== 0) window.scrollTo(0, 0);
            }
            vv.addEventListener("resize", ajuster);
            vv.addEventListener("scroll", ajuster);
            ajuster();
        })();
    </script>
    <script src="chargeur.js"></script>
    <script>
        // Le Service Worker (sw.js) : hors ligne, et un nouveau build ne prend la main qu'à la relance.
        // Il apprend par « ?v= » quelle version le chargeur a choisie : c'est elle qu'il précache.
        // Un échec (enregistrement ou installation) est gardé pour l'écran Infos, jamais avalé.
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", function () {
                navigator.serviceWorker.register("sw.js?v=" + (window.SONDE_VERSION || "wasm")).then(function (r) {
                    var w = r.installing;
                    if (w) w.addEventListener("statechange", function () {
                        if (w.state === "redundant") window.SONDE_SW_ERREUR = "installation échouée (un fichier à précacher manque ou est illisible)";
                    });
                }).catch(function (e) { window.SONDE_SW_ERREUR = "enregistrement refusé : " + e; });
            });
        }
    </script>
</body>
</html>
